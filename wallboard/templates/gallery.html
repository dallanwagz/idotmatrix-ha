{% extends "base.html" %}
{% block content %}
<form method="get" class="filters">
  <input type="text" name="q" value="{{ q }}" placeholder="search name / description">
  <select name="category">
    <option value="">all categories</option>
    {% for c in categories %}
      <option value="{{ c }}" {% if c == category %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>
  <select name="kind">
    <option value="" {% if kind == "" %}selected{% endif %}>gif + png</option>
    <option value="gif" {% if kind == "gif" %}selected{% endif %}>gif only</option>
    <option value="png" {% if kind == "png" %}selected{% endif %}>png only</option>
  </select>
  <button type="submit">search</button>
</form>
<div class="count">{{ assets|length }} assets</div>
<div class="grid">
  {% for a in assets %}
  <div class="card">
    <img src="{{ url_for('asset_file', relpath=a.local) }}" width="96" height="96" class="pixelated" loading="lazy" alt="{{ a.name }}">
    <div class="name">{{ a.name }}</div>
    <div class="desc">{{ a.description }}</div>
    <form method="post" action="{{ url_for('do_push') }}" class="push-row">
      <input type="hidden" name="file_id" value="{{ a.file_id }}">
      <input type="hidden" name="q" value="{{ q }}">
      <input type="hidden" name="category" value="{{ category }}">
      <input type="hidden" name="kind" value="{{ kind }}">
      {% for p in panels %}
        <button type="submit" name="panel" value="{{ p }}">&rarr; {{ p }}</button>
      {% endfor %}
    </form>
  </div>
  {% endfor %}
</div>
{% endblock %}
